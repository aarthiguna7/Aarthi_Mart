<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist - Aarthi Mart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #fdf8ef;
            color: #4a2630;
            font-family: "Poppins", sans-serif;
        }

        .page {
            min-height: 100vh;
        }

        /* --------------------------------
           HEADER
        -------------------------------- */

        header {
            height: 76px;
            background: #fffaf2;
            border-bottom: 1px solid #eadfd2;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .back-btn {
            text-decoration: none;
            color: #4a2630;

            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 14px;
            font-weight: 500;
        }

        .back-btn:hover {
            opacity: 0.7;
        }

        .logo {
            font-family: "Playfair Display", serif;
            font-size: 27px;
            font-weight: 700;
            color: #6f2939;
        }

        .cart-link {
            text-decoration: none;
            color: #4a2630;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --------------------------------
           CONTENT
        -------------------------------- */

        main {
            width: min(1180px, 92%);
            margin: auto;
            padding: 45px 0 70px;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h1 {
            font-family: "Playfair Display", serif;
            font-size: 42px;
            color: #6f2939;
            margin-bottom: 8px;
        }

        .heading p {
            color: #8a7478;
            font-size: 14px;
        }

        /* --------------------------------
           WISHLIST GRID
        -------------------------------- */

        #wishlistGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .product-card {
            background: #fffdf9;
            border: 1px solid #eadfd2;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #f3eadf;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .remove-btn {
            position: absolute;
            top: 12px;
            right: 12px;

            width: 36px;
            height: 36px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 250, 242, 0.95);
            color: #8b3046;

            cursor: pointer;
            font-size: 15px;
        }

        .remove-btn:hover {
            background: #8b3046;
            color: white;
        }

        .product-info {
            padding: 17px;
        }

        .product-category {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a17d85;
            margin-bottom: 5px;
        }

        .product-name {
            font-family: "Playfair Display", serif;
            font-size: 18px;
            color: #4a2630;
            min-height: 46px;
        }

        .product-price {
            margin-top: 8px;
            font-weight: 600;
            color: #6f2939;
            font-size: 16px;
        }

        .add-cart-btn {
            width: 100%;
            margin-top: 14px;
            padding: 11px;

            border: 1px solid #6f2939;
            border-radius: 7px;

            background: #6f2939;
            color: white;

            font-family: "Poppins", sans-serif;
            font-size: 13px;
            font-weight: 500;

            cursor: pointer;
        }

        .add-cart-btn:hover {
            background: #54202c;
        }

        .add-cart-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* --------------------------------
           EMPTY STATE
        -------------------------------- */

        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state i {
            font-size: 45px;
            color: #b77b89;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            font-family: "Playfair Display", serif;
            font-size: 30px;
            color: #6f2939;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #8a7478;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            text-decoration: none;
            background: #6f2939;
            color: white;

            padding: 12px 25px;
            border-radius: 7px;

            font-size: 13px;
            font-weight: 500;
        }

        .shop-btn:hover {
            background: #54202c;
        }

        /* --------------------------------
           FOOTER ACTION
        -------------------------------- */

        .wishlist-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .clear-btn {
            border: none;
            background: transparent;
            color: #8b3046;

            font-family: "Poppins", sans-serif;
            font-size: 13px;

            cursor: pointer;
        }

        .clear-btn:hover {
            text-decoration: underline;
        }

        /* --------------------------------
           RESPONSIVE
        -------------------------------- */

        @media (max-width: 900px) {

            #wishlistGrid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 650px) {

            header {
                padding: 0 20px;
            }

            .logo {
                font-size: 22px;
            }

            main {
                width: 92%;
                padding-top: 30px;
            }

            .heading h1 {
                font-size: 34px;
            }

            #wishlistGrid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }

            .product-info {
                padding: 12px;
            }

            .product-name {
                font-size: 16px;
            }
        }

        @media (max-width: 400px) {

            #wishlistGrid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <header>

        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </a>

        <div class="logo">
            Aarthi Mart
        </div>

        <a href="cart.html" class="cart-link">
            <i class="fa-solid fa-bag-shopping"></i>
            Cart
        </a>

    </header>


    <main>

        <div class="heading">

            <h1>My Wishlist ♡</h1>

            <p>
                The pieces you've saved for later.
            </p>

        </div>


        <div class="wishlist-actions">

            <button
                    id="clearWishlistBtn"
                    class="clear-btn"
                    type="button">
                Clear Wishlist
            </button>

        </div>


        <div id="wishlistGrid"></div>

    </main>

</div>


<script>

    const wishlistGrid =
        document.getElementById("wishlistGrid");

    const clearWishlistBtn =
        document.getElementById("clearWishlistBtn");


    /* --------------------------------
       LOAD WISHLIST
    -------------------------------- */

    async function loadWishlist() {

        wishlistGrid.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:60px;
                color:#8a7478;">
                Loading your wishlist...
            </div>
        `;

        try {

            const response =
                await fetch("wishlist");

            if (response.status === 401) {

                window.location.href = "login.html";
                return;
            }

            if (!response.ok) {

                throw new Error("Wishlist request failed");
            }

            const products =
                await response.json();

            renderWishlist(products);

        } catch (error) {

            console.error(error);

            wishlistGrid.innerHTML = `
                <div style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:60px;
                    color:#8b3046;">
                    Unable to load your wishlist.
                </div>
            `;
        }
    }


    /* --------------------------------
       RENDER WISHLIST
    -------------------------------- */

    function renderWishlist(products) {

        if (!products || products.length === 0) {

            clearWishlistBtn.style.display = "none";

            wishlistGrid.innerHTML = `

                <div class="empty-state"
                     style="grid-column:1/-1;">

                    <i class="fa-regular fa-heart"></i>

                    <h2>Your wishlist is empty</h2>

                    <p>
                        Save something you love and it'll appear here.
                    </p>

                    <a href="index.html"
                       class="shop-btn">
                        Continue Shopping
                    </a>

                </div>

            `;

            return;
        }

        clearWishlistBtn.style.display = "block";

        wishlistGrid.innerHTML =
            products.map(product => {

                const image =
                    product.imageUrl ||
                    "https://via.placeholder.com/600x800?text=Aarthi+Mart";

                const price =
                    Number(product.price || 0)
                        .toLocaleString("en-IN");

                return `

                    <div class="product-card">

                        <div class="product-image">

                            <img
                                src="${escapeHtml(image)}"
                                alt="${escapeHtml(product.name)}"
                                loading="lazy">

                            <button
                                class="remove-btn"
                                type="button"
                                title="Remove from wishlist"
                                onclick="removeFromWishlist(${product.id})">

                                <i class="fa-solid fa-heart"></i>

                            </button>

                        </div>

                        <div class="product-info">

                            <div class="product-category">
                                ${escapeHtml(product.category || "Fashion")}
                            </div>

                            <div class="product-name">
                                ${escapeHtml(product.name)}
                            </div>

                            <div class="product-price">
                                ₹${price}
                            </div>

                            <button
                                class="add-cart-btn"
                                type="button"
                                onclick="addToCart(${product.id}, this)">

                                <i class="fa-solid fa-cart-plus"></i>
                                Add to Cart

                            </button>

                        </div>

                    </div>
                `;

            }).join("");
    }


    /* --------------------------------
       REMOVE ONE ITEM
    -------------------------------- */

    async function removeFromWishlist(productId) {

        try {

            const body =
                new URLSearchParams();

            body.append("action", "remove");
            body.append("productId", productId);

            const response =
                await fetch("wishlist", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: body.toString()
                });

            if (response.status === 401) {

                window.location.href = "login.html";
                return;
            }

            if (!response.ok) {

                throw new Error("Remove failed");
            }

            await loadWishlist();

        } catch (error) {

            console.error(error);

            alert(
                "Could not remove this item. Please try again."
            );
        }
    }


    /* --------------------------------
       CLEAR WISHLIST
    -------------------------------- */

    clearWishlistBtn.addEventListener(
        "click",
        async function () {

            const confirmed =
                confirm(
                    "Remove everything from your wishlist?"
                );

            if (!confirmed) {
                return;
            }

            try {

                const body =
                    new URLSearchParams();

                body.append("action", "clear");
                body.append("productId", "0");

                const response =
                    await fetch("wishlist", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body: body.toString()
                    });

                if (response.status === 401) {

                    window.location.href =
                        "login.html";

                    return;
                }

                if (!response.ok) {

                    throw new Error("Clear failed");
                }

                await loadWishlist();

            } catch (error) {

                console.error(error);

                alert(
                    "Could not clear your wishlist."
                );
            }
        }
    );


    /* --------------------------------
       ADD TO CART
    -------------------------------- */

    async function addToCart(productId, button) {

        button.disabled = true;

        try {

            const body =
                new URLSearchParams();

            body.append("action", "add");
            body.append("productId", productId);
            body.append("quantity", "1");

            const response =
                await fetch("cart", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: body.toString()
                });

            if (response.status === 401) {

                window.location.href =
                    "login.html";

                return;
            }

            if (!response.ok) {

                throw new Error("Cart request failed");
            }

            button.innerHTML =
                '<i class="fa-solid fa-check"></i> Added';

            setTimeout(() => {

                button.innerHTML =
                    '<i class="fa-solid fa-cart-plus"></i> Add to Cart';

                button.disabled = false;

            }, 1000);

        } catch (error) {

            console.error(error);

            button.disabled = false;

            alert(
                "Could not add this item to your cart."
            );
        }
    }


    /* --------------------------------
       ESCAPE HTML
    -------------------------------- */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* --------------------------------
       START
    -------------------------------- */

    loadWishlist();

</script>

</body>
</html>
